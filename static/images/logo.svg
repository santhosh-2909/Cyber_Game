<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <style>
    .logo-stroke { stroke: #00F0FF; }
    .logo-fill { fill: #00F0FF; }
    .logo-shield-bg { fill: #0D131F; }
    .logo-core { fill: #00F0FF; fill-opacity: 0.18; }
    @media (prefers-color-scheme: light) {
      .logo-stroke { stroke: #00839E; }
      .logo-fill { fill: #00839E; }
      .logo-shield-bg { fill: #E2E8F0; }
      .logo-core { fill: #00839E; fill-opacity: 0.15; }
    }
  </style>

  <!-- Outer Shield Geometry -->
  <path class="logo-shield-bg logo-stroke" d="M24 4L7 11V22C7 32.5 14.2 42.1 24 45C33.8 42.1 41 32.5 41 22V11L24 4Z" 
        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Inner Core Fill -->
  <path class="logo-core" d="M24 8L11 13.7V22C11 30.2 16.5 37.8 24 40.2C31.5 37.8 37 30.2 37 22V13.7L24 8Z" />

  <!-- Tactical Reticle / Crosshair -->
  <circle class="logo-stroke" cx="24" cy="23" r="7" stroke-width="1.75" stroke-dasharray="2 2" />
  <circle class="logo-fill" cx="24" cy="23" r="3" />
  <line class="logo-stroke" x1="24" y1="12" x2="24" y2="15" stroke-width="1.75" stroke-linecap="round" />
  <line class="logo-stroke" x1="24" y1="31" x2="24" y2="34" stroke-width="1.75" stroke-linecap="round" />
  <line class="logo-stroke" x1="13" y1="23" x2="16" y2="23" stroke-width="1.75" stroke-linecap="round" />
  <line class="logo-stroke" x1="32" y1="23" x2="35" y2="23" stroke-width="1.75" stroke-linecap="round" />

  <!-- Forensics Loupe Handle Accent -->
  <path class="logo-stroke" d="M28.5 27.5L34 33" stroke-width="2.5" stroke-linecap="round" />
</svg>
