<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadow Systems &middot; Staff Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0b1020; color: #dbe2f2; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .portal {
      width: 100%; max-width: 460px; background: #10162b;
      border: 1px solid #23304f; border-radius: 12px; padding: 32px 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .brand .mark {
      width: 34px; height: 34px; border-radius: 8px; background: #1f2937;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; color: #60a5fa; letter-spacing: 1px; font-size: .85rem;
    }
    .brand .name { font-weight: 700; letter-spacing: .04em; color: #e2e8f0; }
    .tagline { font-size: .78rem; color: #64748b; margin-bottom: 22px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: .72rem; letter-spacing: .08em;
      text-transform: uppercase; color: #8192ad; margin-bottom: 6px; }
    input {
      width: 100%; padding: 11px 13px; border-radius: 8px;
      border: 1px solid #2a3a5f; background: #0c1226; color: #e2e8f0;
      font-size: .9rem; outline: none;
    }
    input:focus { border-color: #60a5fa; }
    button {
      width: 100%; margin-top: 6px; padding: 12px; border: 0; border-radius: 8px;
      background: #1e3a8a; color: #fff; font-weight: 600; cursor: pointer; font-size: .9rem;
    }
    button:hover { background: #1d4ed8; }
    .foot { margin-top: 18px; font-size: .72rem; color: #4a5673; text-align: center; }
    .note { margin-top: 16px; font-size: .72rem; color: #64748b; }
  </style>
</head>
<body>
  <!-- debug flag: {{ debug_flag }} -->
  <div class="portal">
    <div class="brand">
      <div class="mark">SH</div>
      <div class="name">Shadow Systems</div>
    </div>
    <div class="tagline">Staff Portal &middot; Variant {{ letter }}</div>
    <form onsubmit="return false;">
      <div class="field">
        <label for="user">Username</label>
        <input id="user" type="text" autocomplete="off" spellcheck="false" value="staff">
      </div>
      <div class="field">
        <label for="pass">Password</label>
        <input id="pass" type="password">
      </div>
      <button type="submit">Sign in</button>
    </form>
    <div class="note">Access locked. Contact IT if the portal is not responding.</div>
    <div class="foot">&copy; 2026 Shadow Systems &middot; internal staging</div>
  </div>
</body>
</html>
